# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - sundew-french

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm ci, build, and test
        run: |
          npm ci
          npm run build
          npm test

      # The free App Service tier stops the site when a build exceeds its CPU
      # quota (3 CPU-minutes per 5 minutes), so Azure must not build. Ship the
      # prebuilt standalone server with its static assets instead; App Service
      # only runs `node server.js`. Zipping here keeps file modes intact.
      - name: Package the standalone server
        run: |
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          rm -f .next/standalone/.env*
          cd .next/standalone && zip -qr "$GITHUB_WORKSPACE/release.zip" .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F2E2D59A3925432891EF1BAC14213084 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DBB721B9BF7F41169B1D603F44A8416F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B3453E864B414520993B556080718E8F }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sundew-french'
          slot-name: 'Production'
          package: release.zip
          # App Service sets HOSTNAME to the container name; bind on all interfaces.
          startup-command: 'HOSTNAME=0.0.0.0 node server.js'
